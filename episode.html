<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythos Atlas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=18"></head><body><nav class="topbar" style="background:#242019;max-width:none;padding-left:max(28px,calc((100% - 1180px)/2));padding-right:max(28px,calc((100% - 1180px)/2))"><a href="index.html" class="brand" style="color:white;text-decoration:none">MYTHOS ATLAS</a><div class="lang-switch"><button class="lang-btn" id="ko">🇰🇷 한국어</button><button class="lang-btn" id="en">🇬🇧 English</button></div></nav><main class="article-shell"><div id="article">Loading…</div></main><script src="episodes.js?v=18"></script><script src="episode-17.js?v=18"></script><script src="episode-18.js?v=18"></script><script>const q=new URLSearchParams(location.search);const n=Number(q.get('n')||1);let lang=q.get('lang')||localStorage.getItem('myth-lang')||'ko';function addVisual(meta){const article=document.querySelector('#article article');if(!article||!meta.image)return;const fig=document.createElement('figure');fig.className='article-visual';fig.innerHTML=`<img src="${meta.image}" alt="${lang==='ko'?meta.imageCaptionKo:meta.imageCaptionEn}"><figcaption>${lang==='ko'?meta.imageCaptionKo:meta.imageCaptionEn} · <a href="${meta.imageSource}" target="_blank" rel="noreferrer">${lang==='ko'?'이미지 출처 / 라이선스':'Image source / license'}</a></figcaption>`;const anchor=article.querySelector('.muted')||article.querySelector('h1');anchor.insertAdjacentElement('afterend',fig)}async function load(){localStorage.setItem('myth-lang',lang);document.documentElement.lang=lang;document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active',x.id===lang));const meta=EPISODES.find(e=>e.n===n);if(!meta){document.getElementById('article').innerHTML='<p>Episode metadata not found.</p>';return;}document.title=(lang==='ko'?meta.ko:meta.en)+' — Mythos Atlas';try{const r=await fetch(`content/${lang}/${String(n).padStart(2,'0')}.html?v=18`);if(!r.ok)throw 0;document.getElementById('article').innerHTML=await r.text();addVisual(meta)}catch(e){document.getElementById('article').innerHTML=`<p class="section-kicker">EPISODE ${String(n).padStart(2,'0')}</p><h1>${lang==='ko'?meta.ko:meta.en}</h1><p>${lang==='ko'?'본문을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.':'The chapter could not be loaded. Please try again shortly.'}</p>`}}document.getElementById('ko').onclick=()=>{lang='ko';load()};document.getElementById('en').onclick=()=>{lang='en';load()};load();</script></body></html>
